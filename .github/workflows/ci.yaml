name: car-valuer-agent-ci

on: 
  push:
    branches:
      - master
jobs:
  build-agent:
    runs-on: ubuntu
    permissions:
        packages: write
        id-token: write
    env:
      BUILD_NUMBER: "1.0.0"
      SERVER_PORT: "8080"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: build-image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v4
      - name: Build And Push
        uses: docker/build-push-action@v7
        with:
          tags: ${{github.actor}}/car-valuer-agent
          push: true  
          build-args: |
            BUILD_VERSION=${{ env.BUILD_NUMBER }}
            SERVER_PORT=${{ env.SERVER_PORT }}
          no-cache: true

          
