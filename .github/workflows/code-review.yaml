name: code-review

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Kind of cation"
        required: false
        default: "code-review"  
jobs:
   code-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ github.ref_name }}

            use `code-reviewer` agent to review this project codebase
          show_full_output: true
