name: code-review

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Kind of cation"
        required: false
        default: "code-review"  
jobs:
   code-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ github.ref_name }}

            use `code-reviewer` agent to review this project codebase.

            IMPORTANT: this is a one-shot, non-interactive CI run. If you launch
            the code-reviewer agent as a background/async task, this run will end
            before it finishes and you will never receive its findings. Run it
            synchronously (foreground) so its full findings are included in your
            final response.
          show_full_output: true
