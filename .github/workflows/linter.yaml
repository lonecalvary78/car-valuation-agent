name: linter

on:      
  schedule:
    - cron: '0 0 * *  3'
      timezone: "Asia/Singapore"
jobs:
  linter-check:
    strategy:
      matrix:
        os: ["ubuntu-latest","macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with: 
          go-version: 1.26.5  
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --config=.golangci.yml

