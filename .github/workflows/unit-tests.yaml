name: unit-tests

on:
   schedule:
     - cron: '0 0 * *  3'
       timezone: "Asia/Singapore"
jobs:
  unit-tests:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
       - name: Checkout
         uses: actions/checkout@v7
       - name: Setup Go
         uses: actions/setup-go@v6
         with: 
          go-version: 1.26.5  
       - name: Run all unit tests with coverage
         run: go test ./... -cover  
           
