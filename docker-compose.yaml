services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7
    ports:
      - 7080:7080
    environment:
      - KC_DB_USERNAME=<DBUSERNAME>
      - KC_DB_PASSWORD=<DBPASSWORD>
      - KC_HOSTNAME=localhost
    command: ["start-dev", "--http-port", "7080"]
  agent-memory-db:
    container_name: agent-memory-db
    image: pgvector/pgvector:pg18
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agent-memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7080/health/ready"]
      interval: 15s
      timeout: 2s
      retries: 15      
  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - 6379:6379
    environment:
      - REDIS_ARGS=--appendonly yes 
    volumes:
      - redis-data:/data
  car-valuer-agent:
    depends_on:
      - keycloak
      - agent-memory-db
      - redis
    image: car-valuer-agent
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_VERSION=1.0.0
        - SERVER_PORT=8585
      no_cache: true
    ports:
      - 8585:8585
    env_file:
      - .env